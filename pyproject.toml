[project]
name = "file-master"
version = "2.0.0"
description = "FileMaster - 本地索引式桌面文件管家 (PySide6 + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "qtawesome>=1.4",
    "Pillow>=10",
    "mutagen>=1.47",
    "PyMuPDF>=1.24",
    "imageio-ffmpeg>=0.5",
    "Send2Trash>=1.8",
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "cryptography>=44",
    "argon2-cffi>=25",
    "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

# ==========================================
# Ruff：轻量 lint（M0 不做大规模风格重排）
# ==========================================
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["file_venv", "build", "dist", "docs"]

[tool.ruff.lint]
select = [
    "E4",  # import 相关错误
    "E7",  # 语句错误
    "E9",  # 运行时/语法错误
    "F",   # pyflakes（未使用变量、未定义名称等）
    "B",   # flake8-bugbear 常见缺陷
]
ignore = [
    "E701", # 存量代码大量单行 if，M0 不做风格重排
    "E702", # 存量代码单行分号语句，同上
    "E722", # 存量 bare except，后续里程碑逐步收紧
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]          # 入口需先修正 sys.path 再 import src.*
"tests/conftest.py" = ["E402"] # 同上

# ==========================================
# mypy：只检查 core 与 db（铁律层）
# ==========================================
[tool.mypy]
python_version = "3.11"
files = ["src/core", "src/db"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

# ==========================================
# pytest
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
